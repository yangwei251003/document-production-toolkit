name: Verify synthetic workflow and publish guide
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m document_toolkit check
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --check archive/session/2026-08-03-17-30-10/create_form.js
      - run: python -m document_toolkit demo --output .demo-build
      - run: python -m document_toolkit session-demo --output .session-demo-build
      - run: python tools/assemble_preview.py --resume .demo-build/review --session .session-demo-build/review --output _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
